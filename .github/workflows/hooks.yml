# Hook self-check on the three systems the hooks run on. On Windows the job uses
# Git Bash with a native jq.exe, where the CRLF and MSYS path bugs show up.
name: Hooks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-hooks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # Before checkout: a CRLF checkout breaks the shell scripts on Windows.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      # jq is the only tool the tests need.
      - name: Install jq
        run: |
          case "$RUNNER_OS" in
            macOS) brew install jq ;;
            Linux) sudo apt-get update && sudo apt-get install -y jq ;;
            Windows) choco install jq --no-progress -y ;;
          esac
      - name: Show versions
        run: |
          bash --version | head -n 1
          jq --version
      # The CRLF tests cover the bug only if the jq that Git Bash picks first is a native
      # build that writes CRLF. Count the bytes in a pipe: command substitution drops a CR.
      - name: Check that plain jq writes CRLF and jq -b writes LF
        if: runner.os == 'Windows'
        run: |
          command -v jq
          plain=$(jq -rn '"a\nb"' | tr -cd '\r' | wc -c)
          binary=$(jq -b -rn '"a\nb"' | tr -cd '\r' | wc -c)
          echo "CR bytes: plain jq $plain, jq -b $binary"
          [ "$plain" -gt 0 ] && [ "$binary" -eq 0 ] || { echo "::error::jq on PATH does not write CRLF, so the CRLF tests would not cover the bug"; exit 1; }
      - run: bash hooks/test-hooks.sh
