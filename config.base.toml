# Codex CLI Configuration
# This configuration uses LiteLLM as the model provider gateway
# See: https://docs.litellm.ai/docs/simple_proxy
model = "gpt-5.5"
# model_provider = "github"
model_verbosity = "medium"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
model_reasoning_effort = "xhigh"
suppress_unstable_features_warning = true
web_search = "disabled" # live
personality = "pragmatic"

[features]
skills = true
unified_exec = true
shell_snapshot = true
multi_agent = true
steer = true
collaboration_modes = true
personality = true
voice_transcription = true

[sandbox_workspace_write]
network_access = true

[mcp_servers.anvil]
command = "anvil-stdio.sh"
args = [ "--server-id=anvil", "--init-function=anvil-enable", "--stop-function=anvil-disable"]

[mcp_servers.anvil.tools.emacs-eval]
approval_mode = "approve"

[mcp_servers.emacs-eval]
command = "anvil-stdio.sh"
args = [ "--server-id=emacs-eval"]

[tui]
status_line = ["model-with-reasoning", "context-remaining", "git-branch", "context-used", "context-window-size", "used-tokens", "total-output-tokens", "five-hour-limit"]
theme = "catppuccin-latte"

[tui.model_availability_nux]
"gpt-5.5" = 4
