# Codex CLI Configuration
# This configuration uses LiteLLM as the model provider gateway
# See: https://docs.litellm.ai/docs/simple_proxy
model = "gpt-5.5"
# model_provider = "github"
model_verbosity = "medium"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
model_reasoning_effort = "xhigh"
suppress_unstable_features_warning = true
web_search = "disabled" # live
personality = "pragmatic"

[features]
skills = true
unified_exec = true
shell_snapshot = true
multi_agent = true
steer = true
collaboration_modes = true
personality = true
voice_transcription = true

[sandbox_workspace_write]
network_access = true

[mcp_servers.anvil]
command = "anvil-stdio.sh"
args = [ "--server-id=anvil", "--init-function=anvil-enable", "--stop-function=anvil-disable"]

[mcp_servers.anvil.tools.emacs-eval]
approval_mode = "approve"

[mcp_servers.emacs-eval]
command = "anvil-stdio.sh"
args = [ "--server-id=emacs-eval"]

[tui]
status_line = ["model-with-reasoning", "git-branch", "context-used", "project-name", "branch-changes", "run-state", "thread-title"]
theme = "monokai-extended-light"
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.5" = 4

[marketplaces.claude-plugins-official]
last_updated = "2026-06-15T05:30:37Z"
last_revision = "be88f154f6ab4f0c5142585ede3d9763aca38bd4"
source_type = "git"
source = "https://github.com/anthropics/claude-plugins-official.git"

[marketplaces.visual-explainer-marketplace]
last_updated = "2026-06-12T05:31:08Z"
last_revision = "8f1d0e38ab0f265632a31d2fd032f7b730c98c15"
source_type = "git"
source = "https://github.com/nicobailon/visual-explainer.git"

[plugins."claude-code-setup@claude-plugins-official"]
enabled = true

[plugins."frontend-design@claude-plugins-official"]
enabled = true

[plugins."superpowers@claude-plugins-official"]
enabled = true

[plugins."visual-explainer@visual-explainer-marketplace"]
enabled = true

[shell_environment_policy]
inherit = "core"
