kmodel = "gpt-5.6-sol"
model_verbosity = "medium"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
model_reasoning_effort = "high"
suppress_unstable_features_warning = true
personality = "pragmatic"

[features]
hooks = true
skills = true
unified_exec = true
shell_snapshot = true
multi_agent = true
steer = true
collaboration_modes = true
personality = true
voice_transcription = true
js_repl = false

[sandbox_workspace_write]
network_access = true

[mcp_servers.anvil]
command = "anvil-stdio.sh"
args = [
    "--server-id=anvil",
    "--init-function=anvil-enable",
    "--stop-function=anvil-disable",
]

[mcp_servers.anvil.tools.emacs-eval]
approval_mode = "approve"

[mcp_servers.emacs-eval]
command = "anvil-stdio.sh"
args = ["--server-id=emacs-eval"]

[tui]
status_line = ["model-with-reasoning", "git-branch", "context-used", "project-name", "branch-changes", "run-state", "thread-title", "five-hour-limit"]
theme = "monokai-extended-light"
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.6-sol" = 4

[shell_environment_policy]
inherit = "core"
set = { NO_PROXY = "localhost,127.0.0.1,::1", no_proxy = "localhost,127.0.0.1,::1" }

[desktop]
followUpQueueMode = "queue"
dock-icon-preference = "app-default"
sansFontSize = 16
codeFontSize = 14

[network]
proxy_url = "http://x:aoc_800e876370ac6a97646ad9de6a775f8b6beff3f95647be86e3bccf1d924d06cb@192.168.8.16:10255"

[notice]
hide_rate_limit_model_nudge = true