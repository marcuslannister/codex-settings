model = "gpt-5.5"
model_verbosity = "medium"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
model_reasoning_effort = "xhigh"
suppress_unstable_features_warning = true
web_search = "disabled"
personality = "pragmatic"

[features]
hooks = true
skills = true
unified_exec = true
shell_snapshot = true
multi_agent = true
steer = true
collaboration_modes = true
personality = true
voice_transcription = true
js_repl = false

[sandbox_workspace_write]
network_access = true

[mcp_servers.anvil]
command = "anvil-stdio.sh"
args = [
    "--server-id=anvil",
    "--init-function=anvil-enable",
    "--stop-function=anvil-disable",
]

[mcp_servers.anvil.tools.emacs-eval]
approval_mode = "approve"

[mcp_servers.emacs-eval]
command = "anvil-stdio.sh"
args = ["--server-id=emacs-eval"]

[tui]
status_line = ["model-with-reasoning", "git-branch", "context-used", "project-name", "branch-changes", "run-state", "thread-title"]
theme = "monokai-extended-light"
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.5" = 4

[shell_environment_policy]
inherit = "core"
