# Codex CLI Configuration
# This configuration uses copilot-gateway as the model provider gateway
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
model_verbosity = "medium"
web_search = "live"
personality = "friendly"
approval_policy = "never"
sandbox_mode = "danger-full-access"
model_context_window = 1000000
model_auto_compact_token_limit = 900000

[features]
apps = true
guardian_approval = true
prevent_idle_sleep = true
memories = false
goals = true
hooks = true
skills = true
unified_exec = true
shell_snapshot = true
multi_agent = true
steer = true
collaboration_modes = true
personality = true
voice_transcription = true
js_repl = false

[memories]
disable_on_external_context = true

[sandbox_workspace_write]
network_access = true

[mcp_servers.anvil]
command = "anvil-stdio.sh"
args = [ "--server-id=anvil", "--init-function=anvil-enable", "--stop-function=anvil-disable"]

[mcp_servers.anvil.tools.emacs-eval]
approval_mode = "approve"

[mcp_servers.emacs-eval]
command = "anvil-stdio.sh"
args = [ "--server-id=emacs-eval"]

[mcp_servers.emacs-eval.tools.file-batch-across]
approval_mode = "approve"

[mcp_servers.codegraph]
command = "codegraph"
args = ["serve", "--mcp"]

[plugins."waza@waza"]
enabled = false

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."ponytail@ponytail"]
enabled = true

[plugins."nowledge-mem@nowledge-community"]
enabled = true

[tui]
status_line = ["model-with-reasoning", "git-branch", "context-used", "project-name", "branch-changes", "run-state", "five-hour-limit"]
theme = "monokai-extended-light"
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.6-sol" = 4

[shell_environment_policy]
inherit = "core"
set = { NO_PROXY = "localhost,127.0.0.1,::1", no_proxy = "localhost,127.0.0.1,::1" }

[desktop]
followUpQueueMode = "queue"
dock-icon-preference = "app-default"

[notice.model_migrations]
"gpt-5.4-mini" = "gpt-5.6-luna"

